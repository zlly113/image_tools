<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312e81" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- 工具箱箱体 -->
  <g filter="url(#dropShadow)" transform="translate(64, 76)">
    <!-- 提手 -->
    <path d="M 132 100 C 132 40, 252 40, 252 100" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <!-- 箱盖 -->
    <path d="M 32 140 L 352 140 A 24 24 0 0 1 376 164 L 376 210 L 8 210 L 8 164 A 24 24 0 0 1 32 140 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- 箱身 -->
    <path d="M 8 210 L 376 210 L 376 316 A 28 28 0 0 1 348 344 L 36 344 A 28 28 0 0 1 8 316 Z" fill="#e0e7ff"/>
    <!-- 锁扣装饰 -->
    <rect x="168" y="186" width="48" height="48" rx="12" fill="#fbbf24"/>
    <circle cx="192" cy="204" r="6" fill="#78350f"/>
    <!-- 智能高光与星光 (代表本地 AI / 图像计算能力) -->
    <path d="M 310 80 Q 330 100 350 100 Q 330 100 310 120 Q 310 100 290 100 Q 310 100 310 80 Z" fill="#fde047"/>
    <path d="M 70 80 Q 82 95 95 95 Q 82 95 70 110 Q 70 95 55 95 Q 70 95 70 80 Z" fill="#67e8f9"/>
  </g>
</svg>
